<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .evidence-container {
            text-align: center;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        img {
            max-height: 1000vh;
            width: auto;
            border: 1px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    
    <div class="evidence-container">
        <h1>DOWÓD #1</h1>
        
        <img src="pamietnik.png" alt="Pamiętnik">
        
        <button onclick="location.href='index.html'">ZAKOŃCZ SESJĘ</button>
    </div>
</body>
</html>
