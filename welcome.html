<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2 class="welcome-text" id="welcomeMsg"></h2>
        <h3 class="welcome-text" style="animation-delay: 2s;">Chcesz odkryć tajemnice?</h3>
        
        <div class="welcome-text" style="animation-delay: 3s; margin-top: 20px;">
            <button onclick="location.href='secret.html'">TAK</button>
            <button onclick="abortConnection()">NIE</button>

                <script>
                function abortConnection() {
                    document.body.innerHTML = "<div style='color:red; text-align:center; margin-top:20%; font-family:monospace;'>POŁĄCZENIE PRZERWANE... CZYSZCZENIE ŚLADÓW...</div>";
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 2000);
                }
                </script>
        </div>
    </div>

    <script>
        const name = localStorage.getItem("kryptonim");
        document.getElementById('welcomeMsg').innerText = `Witamy ${name}...`;
    </script>
</body>
</html>
