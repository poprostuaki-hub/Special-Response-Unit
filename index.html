<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>ArchiwumX - Logowanie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <h1>ArchiwumX</h1>
        <div class="login-box">
            <input type="text" id="username" placeholder="Kryptonim..." autocomplete="off">
            <input type="password" id="password" placeholder="Hasło..." autocomplete="off">
            <button onclick="checkAccess()">ODKRYJ</button>
        </div>
        <p id="error-msg"></p>
    </div>

    <script>
    function checkAccess() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const correctPassword = "butelka"; 

        if (pass === correctPassword) {
            if (user.trim() === "") {
                alert("Podaj swój kryptonim!");
                return;
            }
            localStorage.setItem("kryptonim", user);
            window.location.href = "welcome.html";
        } else {
            const error = document.getElementById('error-msg');
            error.innerText = "BŁĄD KRYTYCZNY: NIEPOPRAWNE HASŁO";
            error.style.animation = "shake 0.5s";
            setTimeout(() => { error.style.animation = ""; }, 500);
        }
    }
    </script>
</body>

</html>
