<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>ArchiwumX - Logowanie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <h1>ArchiwumX</h1>
        <div class="login-box">
            <input type="text" id="username" placeholder="Kryptonim..." autocomplete="off">
            <input type="password" id="password" placeholder="Hasło..." autocomplete="off">
            <button onclick="checkAccess()">ODKRYJ</button>
        </div>
        <p id="error-msg"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
